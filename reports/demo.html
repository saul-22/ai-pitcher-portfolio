  // ────────────────────────────────────────────────────────
  // 渲染
  // ────────────────────────────────────────────────────────
  function render(s) {
    document.getElementById('im-intro').textContent = s.intro;
    document.getElementById('im-outro').innerHTML = s.outro;
    document.getElementById('scene-tag').textContent = s.tag;

    const card = document.getElementById('card');
    card.innerHTML = `
      <div class="card-brand page-brand">
        <div class="page-brand-logo"><span class="page-brand-dot"></span> ${s.brand.title}</div>
        <div class="card-brand-meta">
          <div class="date">${s.brand.date}</div>
          <div class="scope">${s.brand.scope}</div>
        </div>
      </div>

      <div class="card-kpi">
        <div class="card-kpi-hero">
          <div class="card-kpi-val">${s.kpi.hero.val}</div>
          <div class="card-kpi-lbl">${s.kpi.hero.lbl}${s.kpi.hero.delta ? ` <span class="card-kpi-delta ${s.kpi.hero.deltaCls}">${s.kpi.hero.delta}</span>` : ''}</div>
          ${s.kpi.noSparkline ? `
            <div style="margin-top:var(--space-3);font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.6">
              ${s.kpi.firstReportNote}
            </div>
          ` : `
            <svg class="card-sparkline" viewBox="0 0 200 36" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="${s.kpi.sparkline.polygon}" fill="${s.kpi.sparkline.color}" opacity="0.12"/>
              <line x1="0" y1="${s.kpi.sparkline.mean}" x2="200" y2="${s.kpi.sparkline.mean}" stroke="currentColor" stroke-width="0.6" stroke-dasharray="4,3" opacity="0.4"/>
              <polyline points="${s.kpi.sparkline.line}" fill="none" stroke="${s.kpi.sparkline.color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="${s.kpi.sparkline.circle.cx}" cy="${s.kpi.sparkline.circle.cy}" r="2.5" fill="${s.kpi.sparkline.color}"/>
            </svg>
            <div class="card-spark-lbl">${s.kpi.sparklineLbl}</div>
          `}
        </div>
        <div class="card-kpi-sec">
          ${s.kpi.secs.map(k => `
            <div class="card-kpi-item">
              <div class="card-kpi-val">${k.val}</div>
              <div class="card-kpi-lbl">${k.lbl}${k.delta ? ` <span class="card-kpi-delta ${k.deltaCls}">${k.delta}</span>` : ''}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="card-grid">
        <div class="card-col-left">
          <div class="section-header" style="margin-bottom:0">
            <div class="section-title">${s.accounts.title}</div>
            ${s.accounts.badge ? `<span class="badge ${s.accounts.badge.cls}">${s.accounts.badge.text}</span>` : ''}
          </div>
          <div class="mod-accts">
            ${s.accounts.rows.map(r => `
              <div class="acct-row${r.agg ? ' agg' : ''}">
                <div class="acct-head">
                  <span class="acct-name">${r.name}</span>
                  ${r.hp ? `<span class="hp hp-${r.hp}">${r.hpText}</span>` : ''}
                  ${r.owner ? `<span class="acct-owner">${r.owner}</span>` : ''}
                  <span class="acct-rev">${r.rev}</span>
                  <span class="acct-roi">${r.roi}</span>
                  ${r.delta ? `<span class="delta delta-${r.deltaCls}">${r.delta}</span>` : ''}
                </div>
                <div class="acct-bar">
                  <div class="acct-bar-track"><div class="acct-bar-fill" style="width:${r.barPct}%"></div></div>
                  <span class="acct-bar-pct">${r.barPct}%</span>
                </div>
                ${r.note ? `<div class="acct-note acct-note-${r.noteCls}">${r.note}</div>` : ''}
              </div>
            `).join('')}
          </div>
          <div class="mod-accts-footnote">${s.accounts.footnote}</div>
        </div>

        <div class="card-col-right">
          <div class="mod">
            <div class="mod-title">${s.status.title}</div>
            <div class="mod-status${s.status.variant !== 'default' ? ' mod-status-' + s.status.variant : ''}">
              ${s.status.kicker ? `<div class="mod-status-kicker">${s.status.kicker}</div>` : ''}
              ${s.status.label ? `<div class="mod-status-label">${s.status.label}</div>` : ''}
              ${s.status.num ? `<div class="mod-status-num">${s.status.num}</div>` : ''}
              ${s.status.sub ? `<div class="mod-status-sub">${s.status.sub}</div>` : ''}
            </div>
          </div>

          <div class="mod mod-grow">
            <div class="mod-title">${s.stories.title}</div>
            <div class="mod-stories">
              ${s.stories.items.map(i => `
                <div class="mod-story">
                  <div class="mod-story-meta">${i.meta}</div>
                  <div class="mod-story-body">${i.body}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="mod">
            <div class="mod-title">${s.highlights.title}</div>
            <div class="mod-highlights">
              ${s.highlights.items.map(i => `<div class="mod-hl">${i}</div>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <div class="card-footer">数据来源：AI 智能投手</div>
    `;

    // 同步主题（周报强增长 → warm；其他 light）
    document.body.className = s.theme;
    document.getElementById('btn-light').classList.toggle('active', s.theme === 'theme-light');
    document.getElementById('btn-warm').classList.toggle('active', s.theme === 'theme-warm');
  }

  function loadScene(key) {
    ['weekly', 'monthly', 'daily'].forEach(k => {
      document.getElementById('btn-' + k).classList.toggle('active', k === key);
    });
    render(SCENES[key]);
  }

  function switchTheme(theme) {
    document.body.className = theme;
    document.getElementById('btn-light').classList.toggle('active', theme === 'theme-light');
    document.getElementById('btn-warm').classList.toggle('active', theme === 'theme-warm');
  }

  // 初始加载周报
  loadScene('weekly');
  </script>

</body>
